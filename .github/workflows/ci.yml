name: CI

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build Linux x64 (baseline)
        run: bun build --compile --target=bun-linux-x64-baseline src/index.ts --outfile dist/geode-linux-x64-baseline

      - name: Build Linux x64 (modern)
        run: bun build --compile --target=bun-linux-x64-modern src/index.ts --outfile dist/geode-linux-x64-modern

      - name: Build Linux arm64
        run: bun build --compile --target=bun-linux-arm64 src/index.ts --outfile dist/geode-linux-arm64

      - name: Build Windows x64 (baseline)
        run: bun build --compile --target=bun-windows-x64-baseline src/index.ts --outfile dist/geode-windows-x64-baseline.exe

      - name: Build Windows x64 (modern)
        run: bun build --compile --target=bun-windows-x64-modern src/index.ts --outfile dist/geode-windows-x64-modern.exe

      - name: Build macOS arm64
        run: bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/geode-darwin-arm64

      - name: Build macOS x64
        run: bun build --compile --target=bun-darwin-x64 src/index.ts --outfile dist/geode-darwin-x64

      - name: Upload Linux x64 (baseline) artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-linux-x64-baseline
          path: dist/geode-linux-x64-baseline

      - name: Upload Linux x64 (modern) artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-linux-x64-modern
          path: dist/geode-linux-x64-modern

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-linux-arm64
          path: dist/geode-linux-arm64

      - name: Upload Windows x64 (baseline) artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-windows-x64-baseline
          path: dist/geode-windows-x64-baseline.exe

      - name: Upload Windows x64 (modern) artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-windows-x64-modern
          path: dist/geode-windows-x64-modern.exe

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-darwin-arm64
          path: dist/geode-darwin-arm64

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-darwin-x64
          path: dist/geode-darwin-x64
